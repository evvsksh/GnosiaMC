name: GnosiaMC Development Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5.4.0
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Prepare Server
        run: |
          # get latest stuff
          mkdir -p /tmp/minecraft/world/datapacks
          cp -r "$GITHUB_WORKSPACE/world" /tmp/minecraft/world
          cp -r "$GITHUB_WORKSPACE/datapack" /tmp/minecraft/world/datapacks/gnosia

          # set up server
          cd /tmp/minecraft/
          curl -L -o server.jar "https://meta.fabricmc.net/v2/versions/loader/1.21.11/0.19.3/1.1.1/server/jar"

          # set up mods
          mkdir -p /tmp/minecraft/mods
          curl -L -OJ --output-dir "$(pwd)/mods" "https://cdn.modrinth.com/data/9eGKb6K1/versions/tiSyltLv/voicechat-fabric-1.21.11-2.6.20.jar"
          curl -L -OJ --output-dir "$(pwd)/mods" "https://cdn.modrinth.com/data/Vebnzrzj/versions/CzCJJMuo/LuckPerms-Fabric-5.5.21.jar"
          curl -L -OJ --output-dir "$(pwd)/mods" "https://cdn.modrinth.com/data/P7dR8mSH/versions/5zJNhXV2/fabric-api-0.141.4%2B1.21.11.jar"

          # eula
          echo eula=true > eula.txt

          # settings
          echo function-permission-level=4 >> server.properties

      - name: Run and Check Server
        run: |

          RED='\033[0;31m'
          GREEN='\033[0;32m'
          NC='\033[0m'

          cd /tmp/minecraft/
          tree /tmp/minecraft

          FLAGS="-Xmx2G -Dterminal.ansi=true -Dlog4j.skipJansi=false"

          touch server.log
          java $FLAGS -jar server.jar nogui > server.log 2>&1 &
          SERVER_PID=$!

          timeout=120
          elapsed=0
          success=false

          tail -f server.log &

          while [ $elapsed -lt $timeout ]; do
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo -e "${RED}Server process died unexpectedly.${NC}"
              cat server.log
              exit 1
            fi

            if grep -qE "Done \([0-9.]+s\)! For help, type \"help\"" server.log; then
              echo -e "${GREEN}Server completely started up and ready! Shutting down...${NC}"
              kill $SERVER_PID
              success=true
              break
            fi

            if grep -q "Failed to load datapack" server.log || grep -q "Failed to load function" server.log; then
              echo -e "${RED}Critical error detected in server.log:${NC}"
              grep -E "Failed to load datapack|Failed to load function" server.log
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi

            sleep 2
            elapsed=$((elapsed + 2))
          done

          if [ "$success" = false ]; then
            echo -e "${RED}Timeout reached before server finished starting.${NC}"
            kill $SERVER_PID 2>/dev/null || true
            cat server.log
            exit 1
          fi

      - name: Upload Logs Artifact
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: server-logs
          path: /tmp/minecraft/logs/
          if-no-files-found: warn

      - name: Bundle datapack
        run: |
          BUNDLE_DIR="/tmp/bundle-datapack"
          mkdir -p "$BUNDLE_DIR"
          cd "$BUNDLE_DIR"

          cp -r "$GITHUB_WORKSPACE/datapack/*" $BUNDLE_DIR/
          zip -r "$GITHUB_WORKSPACE/datapack.zip" .

      - name: Bundle world
        run: |
          BUNDLE_DIR="/tmp/bundle-world"
          mkdir -p "$BUNDLE_DIR"
          cd "$BUNDLE_DIR"

          cp -r "$GITHUB_WORKSPACE/world/*" $BUNDLE_DIR/
          zip -r "$GITHUB_WORKSPACE/world.zip" .

      - name: Bundle resourcepack
        run: |
          BUNDLE_DIR="/tmp/bundle-resourcepack"
          mkdir -p "$BUNDLE_DIR"
          cd "$BUNDLE_DIR"

          cp -r "$GITHUB_WORKSPACE/resourcepack/*" $BUNDLE_DIR/
          zip -r "$GITHUB_WORKSPACE/resources.zip" .

      - name: Bundle full
        run: |
          BUNDLE_DIR="/tmp/bundle-full"
          mkdir -p "$BUNDLE_DIR"
          cd "$BUNDLE_DIR"

          cp -r "$GITHUB_WORKSPACE/world/*" $BUNDLE_DIR/
          cp -r "$GITHUB_WORKSPACE/datapack/*" $BUNDLE_DIR/datapacks/gnosia/
          cp "$GITHUB_WORKSPACE/resources.zip" $BUNDLE_DIR/resources.zip

          zip -r "$GITHUB_WORKSPACE/full.zip" .

      - name: Generate Release Notes
        run: |
          cat <<EOF > /tmp/release_notes.txt
          > [!NOTE]
          > These are the latest nightly builds generated automatically from the main branch. Please note that these assets are static snapshots and reflect the state of the repository at the time of the last build.

          ## What's Changed
          EOF

          # append commit history
          gh api "repos/evvsksh/GnosiaMC/commits?per_page=15" \
            --jq '.[] | select(.author != null) | select(.commit.message | startswith("Merge") | not) | "- \(.commit.message | split("\n")[0]) by @\(.author.login)"' \
            >> /tmp/release_notes.txt

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          body_path: /tmp/release_notes.txt
          name: GnosiaMC Nightly Build
          prerelase: true
          files: |
            "$GITHUB_WORKSPACE/datapack.zip"
            "$GITHUB_WORKSPACE/world.zip"
            "$GITHUB_WORKSPACE/resources.zip"
            "$GITHUB_WORKSPACE/full.zip"
