name: GnosiaMC Server Test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5.4.0
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Prepare Server
        run: |
          # get latest stuff
          mkdir -p /tmp/minecraft/world/datapacks
          cp -r "$GITHUB_WORKSPACE/rcon" /tmp/minecraft/rcon
          cp -r "$GITHUB_WORKSPACE/world" /tmp/minecraft/world
          cp -r "$GITHUB_WORKSPACE/datapack" /tmp/minecraft/world/datapacks/gnosia

          # set up server
          cd /tmp/minecraft/
          curl -L -o server.jar "https://fill-data.papermc.io/v1/objects/5ffef465eeeb5f2a3c23a24419d97c51afd7dbb4923ff42df9a3f58bba1ccfba/paper-1.21.11-132.jar"

          # set up plugins
          mkdir -p /tmp/minecraft/plugins
          curl -L -OJ --output-dir "$(pwd)/plugins" https://cdn.modrinth.com/data/9eGKb6K1/versions/7wUBXQ5w/voicechat-bukkit-2.6.20.jar
          curl -L -OJ --output-dir "$(pwd)/plugins" https://cdn.modrinth.com/data/Vebnzrzj/versions/MBSY8toc/LuckPerms-Bukkit-5.5.53.jar

          # eula
          echo eula=true > eula.txt

      - name: Run and Check Server
        run: |
          RED='\033[0;31m'
          GREEN='\033[0;32m'
          NC='\033[0m'

          cd /tmp/minecraft/
          FLAGS="-Dterminal.ansi=true -Dlog4j.skipJansi=false -XX:+AlwaysPreTouch -XX:+DisableExplicitGC -XX:+ParallelRefProcEnabled -XX:+PerfDisableSharedMem -XX:+UnlockExperimentalVMOptions -XX:+UseG1GC -XX:G1HeapRegionSize=8M -XX:G1HeapWastePercent=5 -XX:G1MaxNewSizePercent=40 -XX:G1MixedGCCountTarget=4 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1NewSizePercent=30 -XX:G1RSetUpdatingPauseTimePercent=5 -XX:G1ReservePercent=20 -XX:InitiatingHeapOccupancyPercent=15 -XX:MaxGCPauseMillis=200 -XX:MaxTenuringThreshold=1 -XX:SurvivorRatio=32"

          touch server.log
          java $FLAGS -jar server.jar --nogui > server.log 2>&1 &
          SERVER_PID=$!

          timeout=120
          elapsed=0
          success=false

          tail -f server.log &

          while [ $elapsed -lt $timeout ]; do
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo -e "${RED}Server process died unexpectedly.${NC}"
              cat server.log
              exit 1
            fi

            if grep -qE "Done \([0-9.]+s\)! For help, type \"help\"" server.log; then
              echo -e "${GREEN}Server completely started up and ready! Shutting down...${NC}"
              kill $SERVER_PID
              success=true
              break
            fi

            if grep -q "Failed to load datapack" server.log || grep -q "Failed to load function" server.log; then
              echo -e "${RED}Critical error detected in server.log:${NC}"
              grep -E "Failed to load datapack|Failed to load function" server.log
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi

            sleep 2
            elapsed=$((elapsed + 2))
          done

          if [ "$success" = false ]; then
            echo -e "${RED}Timeout reached before server finished starting.${NC}"
            kill $SERVER_PID 2>/dev/null || true
            cat server.log
            exit 1
          fi

      - name: Upload Logs Artifact
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: server-logs
          path: /tmp/minecraft/logs/
          if-no-files-found: warn
